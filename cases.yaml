# Published pedigrees and the values pedsum is checked against.
#
# Each dataset is pinned to a fixed URL (a commit of the read-only CRAN mirror
# on GitHub, a Figshare file, a SourceForge release, a Kinsources export) or to
# a Dryad file id (`dryad_file: <id>`, from `dryad.list_files(doi)`; downloads
# need a Dryad API token, see dryad.py), and to the file's SHA-256. Citations
# for every source are in docs/benchmark-pedigrees.md.
#
# Dataset keys:
#   format                  an R `.rda` file (the default; needs `object`),
#                           `whitespace_table`, `csv`, `tsv` (tab-separated,
#                           keeping empty fields), `iur_txt` (Kinsources IUR
#                           text), `xlsx` (optional `sheet`, else the first),
#                           or `ainv_list` (a lower-triangle A-inverse list
#                           `row column value`, from which the parents are
#                           rebuilt by Henderson's rules; dam and sire are not
#                           distinguished, which F does not depend on). Text
#                           files may be gzipped; `member` reads one file from
#                           a tar or zip archive, and `names` gives the
#                           columns of a file without a header row.
#   columns                 {id, mother, father, sex?}: the source columns
#   missing_parent          tokens meaning "no parent" (R NA always does)
#   sex_map                 source sex code -> 1 (male) or 0 (female)
#   allow_missing_sex       pass --allow-missing-sex to validate and summarize
#   reference_column        a 0/1 column marking the reference population;
#                           the dataset then also runs effective-size
#                           --reference-col
#   parent_overrides        {id: {mother: ..., father: ...}}, null = unknown,
#                           applied before conversion: for documented errors in
#                           the file that validate cannot repair
#   reference_values        {<name>: {...}}: the authors' per-individual values,
#                           keyed by original id. Either {column: <col>}, a
#                           column of the dataset's own source table, or a file
#                           pinned like a dataset (`url` or `dryad_file`,
#                           `sha256`, `member`?) with a `format` that is any
#                           table format above (read `value_column` keyed by
#                           `id_column`), `ainv_rdata` (ASReml-R asreml.Ainverse
#                           triplets in .RData, `object` names the data frame)
#                           or `ainv_list` (both F = diag(inverse of A-inverse)
#                           - 1), or `square_matrix_diagonal` (the diagonal of
#                           a square matrix whose first line holds the ids).
#                           `subtract` is taken off every value (`subtract: 1`
#                           turns an A diagonal into F). Values that are not
#                           numbers (NA, blank, `x`) are skipped.
#
# A check's `via` says where the observed value comes from:
#   summary:<dotted.path>   a scalar in pedsum's summary.yaml
#   annotated:<agg>:<column>
#                           an aggregate of a column of annotated.tsv.gz over
#                           the check's rows: sum, max, mean, frac_gt0 (the
#                           share of rows above 0), count (the number of rows
#                           where the column is nonzero, or true for a boolean
#                           column; nulls are not counted), count_gt:<x> (the
#                           number of rows above x), or of (the row whose
#                           original id is the check's `id`)
#   reference:<name>:<agg>:<column>
#                           pedsum's column against reference_values[<name>],
#                           id by id, over the check's rows that have a
#                           reference value: max_abs_diff, n_within (the number
#                           with |difference| <= `match_tol`, default 1e-6),
#                           n_compared, sum_ref or sum_pedsum (sums over the
#                           compared rows)
#   effective:<estimator>.<field>
#                           a field of effective_size.yaml; datasets with a
#                           reference_column run with --reference-col
#   engine:<name>           computed with the pedigree_graph API that pedsum
#                           depends on, for statistics the pedsum CLI does not
#                           expose yet (see docs/missing-statistics.md)
#   gap                     not reported by pedsum or pedigree_graph; listed so
#                           the published value is not lost
#
# Other check keys. The rows of annotated:/reference: checks can be narrowed:
# `min_grandparents: k` keeps rows with both parents and at least k
# grandparents known, `where: {column: value}` keeps rows equal to the value on
# each column, and `subset: <name>` keeps rows whose id has a value in
# reference_values[<name>]. The observed value is multiplied by `scale`, then
# `offset` is added. `tol` is an absolute tolerance. `status_if_differs:
# expected_difference` marks a known convention difference; the run reports it
# as DIFF instead of FAIL. `note`, `source` and `gap` are reported as given.

